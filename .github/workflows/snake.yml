name: Generate Snake

on:
  # Her 12 saatte bir otomatik çalışır
  schedule:
    - cron: "0 */12 * * *" 
  
  # İstediğin zaman manuel olarak da tetikleyebilirsin
  workflow_dispatch:
  
  # Main branch'e her push yapıldığında çalışır
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # GitHub contribution grafiğinden yılan animasyonunu üretir (v3 sürümü günceldir)
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # Üretilen dosyayı 'output' branch'ine yükler (v4 sürümüne yükseltildi, Node 20 uyarısını çözer)
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
